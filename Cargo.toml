[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
repository = "https://github.com/dasmatus/mcsapi"

[workspace.dependencies]
mcsapi = { path = "crates/mcsapi", version = "0.1.0" }
mcsapi-ui = { path = "crates/mcsapi-ui", version = "0.1.0" }
mcsapi-runtime = { path = "crates/mcsapi-runtime", version = "0.1.0" }
mcsapi-components = { path = "crates/mcsapi-components", version = "0.1.0" }
mcsapi-components-gpui = { path = "crates/mcsapi-components-gpui", version = "0.1.0" }
egui = "0.36.2"
serde_json = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
gpui = { version = "0.2.2", default-features = false, features = ["wayland"] }
# GPUI 0.2.2 pulls xattr 0.2.3, which needs libc's removed Linux ENOATTR alias.
libc = "=0.2.189"
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend"] }

