# Copied from Zed's `icons` crate (github.com/dasmatus/sonne, crates/icons) with
# the SVGs from its assets/icons, which `IconName::path` names.
[package]
name = "mcsapi-zed-icons"
description = "Zed's icon names and SVGs, embedded so apps can serve them as GPUI assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later AND ISC"
repository.workspace = true
include = ["build.rs", "src/**", "icons/**", "LICENSE-GPL", "Cargo.toml"]

[lib]
name = "icons"
path = "src/icons.rs"
doctest = false

[dependencies]
serde = { version = "1.0.221", features = ["derive", "rc"] }
strum = { version = "0.28", features = ["derive"] }

# Zed's workspace lints, which this code was written against: style lints stay
# off so the copy can track Zed's source without local rewrites.
[lints.rust]
unexpected_cfgs = { level = "allow" }

# Zed's doc comments link items these copies leave out and carry bare URLs;
# Zed does not check its docs with rustdoc's lints, so neither do the copies.
[lints.rustdoc]
all = "allow"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
