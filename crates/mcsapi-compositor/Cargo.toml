[package]
name = "mcsapi-compositor"
description = "A Smithay Wayland compositor host for mcsapi desktops: Wayland clients and in-process mcsapi-ui apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Same version egui builds its tree with, so updates pass through unchanged.
accesskit = "0.24.1"
# Publishes the accessibility tree over AT-SPI (D-Bus) for screen readers.
accesskit_unix = { version = "0.22.0", optional = true }
dioxus-devtools = { version = "0.7.10", optional = true }
egui_glow = { version = "0.36.2", default-features = false }
glow = "0.17"
mcsapi.workspace = true
mcsapi-runtime.workspace = true
mcsapi-ui.workspace = true
libc.workspace = true
smithay = { workspace = true, features = ["backend_winit", "desktop", "renderer_gl"] }
subsecond = { version = "0.7.10", optional = true }

[features]
default = ["atspi"]
# Screen readers and other AT-SPI clients see the chrome and in-process apps.
atspi = ["dep:accesskit_unix"]
# Hot-patch a `Hot`-wrapped shell from `dx serve --hot-patch` in debug builds.
hotpatch = ["dep:dioxus-devtools", "dep:subsecond"]
