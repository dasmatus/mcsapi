# Copied from Zed's `menu` crate (github.com/dasmatus/sonne, crates/menu).
[package]
name = "mcsapi-zed-menu"
description = "Zed's menu navigation actions, for its ui components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true

[lib]
name = "menu"
path = "src/menu.rs"
doctest = false
test = false

[dependencies]
gpui = { workspace = true, optional = true }

[features]
gpui = ["dep:gpui"]

# Zed's workspace lints, which this code was written against: style lints stay
# off so the copy can track Zed's source without local rewrites.
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
