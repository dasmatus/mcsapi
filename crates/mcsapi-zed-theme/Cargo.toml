# Copied from Zed's `theme` crate (github.com/dasmatus/sonne, crates/theme)
# without its registry, JSON themes, icon themes and font family cache; the
# active theme comes from an mcsapi theme instead (src/mcsapi.rs).
[package]
name = "mcsapi-zed-theme"
description = "Zed's theme types for its ui components, with colors and fonts from an mcsapi theme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true

[lib]
name = "theme"
path = "src/theme.rs"
doctest = false

[dependencies]
anyhow = "1.0.86"
gpui = { workspace = true, optional = true }
mcsapi-theme.workspace = true
palette = { version = "0.7.5", default-features = false, features = ["std"] }
refineable = { workspace = true, optional = true }
schemars = { version = "1.0", features = ["indexmap2"] }
serde = { version = "1.0.221", features = ["derive", "rc"] }
strum = { version = "0.28", features = ["derive"] }
syntax_theme = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }

[features]
# Everything here is GPUI types; off by default like every other GPUI crate in
# the workspace, so the workspace builds without GPUI's system libraries.
gpui = ["dep:gpui", "dep:refineable", "dep:syntax_theme"]

# Zed's workspace lints, which this code was written against: style lints stay
# off so the copy can track Zed's source without local rewrites.
[lints.rust]
unexpected_cfgs = { level = "allow" }

# Zed's doc comments link items these copies leave out and carry bare URLs;
# Zed does not check its docs with rustdoc's lints, so neither do the copies.
[lints.rustdoc]
all = "allow"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
