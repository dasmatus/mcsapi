# Copied from Zed's `component` crate (github.com/dasmatus/sonne, crates/component).
[package]
name = "mcsapi-zed-component"
description = "Zed's component registry and preview layout, for its ui components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true

[lib]
name = "component"
path = "src/component.rs"
test = false

[dependencies]
collections = { workspace = true, optional = true }
gpui = { workspace = true, optional = true }
inventory = "0.3.19"
parking_lot = "0.12.1"
strum = { version = "0.28", features = ["derive"] }
mcsapi-zed-theme.workspace = true

[features]
gpui = ["dep:collections", "dep:gpui", "mcsapi-zed-theme/gpui"]

# Zed's workspace lints, which this code was written against: style lints stay
# off so the copy can track Zed's source without local rewrites.
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
