[package]
name = "mcsapi-node"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Node.js/TypeScript bindings for mcsapi"
license = "GPL-3.0-only"
repository = "https://github.com/dasmatus/mcsapi"
publish = false

# Standalone so the Node addon does not become part of the root crate's build.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
mcsapi = { path = "../.." }
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
